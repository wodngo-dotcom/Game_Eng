<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>영단어 그림 게임</title>
<meta name="description" content="만 6세 아이를 위한 영단어 발음 맞히기 게임" />
<meta name="theme-color" content="#ffd166" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="startScreen" class="start-screen">
  <div class="logo-emoji">🐶🍎⭐</div>
  <h1>영단어 그림 맞히기</h1>
  <p>그림을 보고 영어 단어를 말해보세요!<br/>100개를 모두 맞히면 챔피언이에요 🏆</p>
  <button id="startBtn" class="primary-btn">시작하기 ▶</button>
  <p class="start-note">마이크 사용 권한이 필요해요. Chrome 브라우저를 추천해요.</p>
</div>

<div class="app-shell">
  <header class="topbar">
    <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
    <div class="progress-label" id="progressLabel">0/100</div>
    <div class="star-count" id="starCount">⭐ 0</div>
  </header>
  <button id="resetBtn" class="reset-btn" style="align-self:flex-end;margin:-4px 2px 0 0;">처음부터 다시하기</button>
  <div class="badge-row" id="badgeRow" aria-live="polite"></div>

  <main class="stage-wrap">
    <div class="category-label" id="categoryLabel">동물</div>

    <div class="card" id="card">
      <div class="correct-flash" id="correctFlash"></div>
      <div class="stage" id="stage">
        <div class="character-stage" id="characterStage">
          <svg class="character" id="character" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
        <div class="burst" id="burst"></div>
        <div class="feedback-toast" id="feedbackToast"></div>
        <div class="combo-toast" id="comboToast"></div>
      </div>
    </div>

    <div class="ko-caption" id="wordKo"></div>

    <div class="word-reveal" id="wordReveal">
      <div class="placeholder" id="wordPlaceholder">? ? ?</div>
      <div class="en" id="wordEn"></div>
    </div>
  </main>

  <div class="controls">
    <div class="waveform" id="waveform">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="mic-row">
      <button id="listenBtn" class="idk-btn listen-btn">🔊 발음 듣기</button>
      <button id="micBtn" class="mic-btn" aria-label="마이크로 말하기">🎤</button>
      <button id="idkBtn" class="idk-btn">모르겠어요</button>
    </div>
    <div class="status-text" id="statusText" aria-live="polite">그림을 보고 영어로 말해보세요!</div>
  </div>
</div>

<!-- Milestone celebration overlay -->
<div id="milestoneOverlay" class="overlay hidden">
  <div class="modal-card">
    <div class="big-emoji" id="milestoneEmoji">🏆</div>
    <h2 id="milestoneTitle">10개 단어 마스터!</h2>
    <p id="milestoneDesc">정말 잘하고 있어요!</p>
    <button id="milestoneContinue" class="primary-btn">계속하기</button>
  </div>
</div>

<!-- Final completion overlay -->
<div id="completeOverlay" class="overlay hidden">
  <div class="modal-card">
    <div class="big-emoji">🎉🏆🎉</div>
    <h2>축하합니다!</h2>
    <p>100개 단어를 모두 배웠어요!</p>
    <div class="word-review-grid" id="wordReviewGrid"></div>
    <button id="restartBtn" class="primary-btn">처음부터 다시하기</button>
  </div>
</div>

<div id="confettiLayer" class="confetti-layer hidden"></div>

<script src="js/words.js"></script>
<script src="js/audio.js"></script>
<script src="js/speech.js"></script>
<script src="js/app.js"></script>
</body>
</html>
